experiment:
  name: hw_table_frame
  description: "Real holohovers h1, h2, h3 tracked by OptiTrack, poses expressed in the table frame"
  machine: master
  rviz_props_file: "common/holohover_params_new.yaml"
  opt_alg: "dsqp"

  file_name_xd_trajectory: ""
  file_name_ud_trajectory: ""
  dmpc_config_folder: ""

hovercraft:
  - name: h1
    id: 1
    initial_state: [0, 0, 0, 0, 0, 0]
    holohover_props: "common/holohover_params_new.yaml" # path starting from holohover_utils/config directory
    color: [1.0, 0.0, 0.0, 1.0]
    simulate: false
    machine: master

  - name: h2
    id: 2
    initial_state: [0, 0, 0, 0, 0, 0]
    holohover_props: "common/holohover_params_new.yaml"
    color: [0.0, 0.0, 1.0, 1.0]
    simulate: false
    machine: master

  - name: h3
    id: 3
    initial_state: [0, 0, 0, 0, 0, 0]
    holohover_props: "common/holohover_params_new.yaml"
    color: [0.0, 1.0, 0.0, 1.0]
    simulate: false
    machine: master
